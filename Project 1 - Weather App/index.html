<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main class="container">
        <h1 class="text-center">Weather Forecast</h1>
        <div class="search-bar">
            <input type="text" placeholder="Enter city name">
            <button>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                    stroke="currentColor" class="size-6" width="17">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
                <span>Search</span>
            </button>
        </div>

        <div class="current-weather-card">
            <h2 class="m-0 fw-600">Current Weather</h2>
            <div>
                <div>
                    <h1 class="m-0 fw-600">23°C</h1>
                    <p class="m-0 current-weather">Sunny</p>
                    <p class="m-0">New York , US</p>
                </div>
                <div><img src="./assets/sun.svg" alt=""></div>
            </div>
        </div>

        <div>
        <h2 class="fw-600">5-Day Forecast</h2>
            <div class="forecast-cards">
                <div class="card">
                    <h3 class="m-0 fw-600">Tue</h3>
                    <div class="text-center">
                        <img src="./assets/cloud.svg" alt="">
                        <p class="m-0 fw-600">20°C</p>
                    </div>
                </div>
                <div class="card">
                    <h3 class="m-0 fw-600">Wed</h3>
                    <div class="text-center">
                        <img src="./assets/sun.svg" height="50px" alt="">
                        <p class="m-0 fw-600">21°C</p>
                    </div>
                </div>
                <div class="card">
                    <h3 class="m-0 fw-600">Thu</h3>
                    <div class="text-center">
                        <img src="./assets/cloud.svg" alt="">
                        <p class="m-0 fw-600">20°C</p>
                    </div>
                </div>
                <div class="card">
                    <h3 class="m-0 fw-600">Thu</h3>
                    <div class="text-center">
                        <img src="./assets/cloud.svg" alt="">
                        <p class="m-0 fw-600">20°C</p>
                    </div>
                </div>
                <div class="card">
                    <h3 class="m-0 fw-600">Thu</h3>
                    <div class="text-center">
                        <img src="./assets/cloud.svg" alt="">
                        <p class="m-0 fw-600">20°C</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
<script src="script.js"></script>

</html>
