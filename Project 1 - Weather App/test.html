<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Weather App</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #72edf2 10%, #5151e5 100%);
            transition: background 0.5s ease;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2rem;
            width: 80%;
            max-width: 600px;
        }
        .search-box {
            display: flex;
            margin-bottom: 2rem;
        }
        .search-box input {
            flex-grow: 1;
            padding: 0.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 20px 0 0 20px;
            outline: none;
        }
        .search-box button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border: none;
            border-radius: 0 20px 20px 0;
            background-color: #ff6b6b;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .search-box button:hover {
            background-color: #ee5253;
        }
        .current-weather {
            text-align: center;
            margin-bottom: 2rem;
        }
        .temperature {
            font-size: 4rem;
            font-weight: bold;
            margin: 0;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .weather-icon {
            font-size: 3rem;
            margin: 1rem 0;
        }
        .location {
            font-size: 1.5rem;
            color: #fff;
        }
        .forecast {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }
        .forecast-item {
            text-align: center;
            flex-grow: 1;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        .forecast-item:hover {
            transform: scale(1.05);
        }
        .forecast-day {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .forecast-temp {
            font-size: 1.2rem;
        }
        /* Custom weather icons */
        .icon-sun::before {
            content: "☀️";
        }
        .icon-cloud::before {
            content: "☁️";
        }
        .icon-rain::before {
            content: "🌧️";
        }
        .icon-snow::before {
            content: "❄️";
        }
        .icon-thunder::before {
            content: "⚡";
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="Enter city name" id="cityInput">
            <button onclick="searchWeather()">Search</button>
        </div>
        <div class="current-weather">
            <h1 class="temperature">23°C</h1>
            <div class="weather-icon icon-sun"></div>
            <p class="location">New York, US</p>
        </div>
        <div class="forecast" id="forecast">
            <!-- Forecast items will be added here by JavaScript -->
        </div>
    </div>

    <script>
        // Simulated weather data
        const weatherData = {
            current: { temp: 23, icon: 'sun', location: 'New York, US' },
            forecast: [
                { day: 'Mon', temp: 22, icon: 'cloud' },
                { day: 'Tue', temp: 19, icon: 'rain' },
                { day: 'Wed', temp: 25, icon: 'sun' },
                { day: 'Thu', temp: 18, icon: 'snow' },
                { day: 'Fri', temp: 21, icon: 'thunder' }
            ]
        };

        function searchWeather() {
            const cityInput = document.getElementById('cityInput');
            const city = cityInput.value;
            // In a real app, you would fetch weather data here
            // For this example, we'll just update the location
            document.querySelector('.location').textContent = city;
        }

        function updateForecast() {
            const forecastContainer = document.getElementById('forecast');
            forecastContainer.innerHTML = '';
            weatherData.forecast.forEach(day => {
                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div class="forecast-day">${day.day}</div>
                    <div class="weather-icon icon-${day.icon}"></div>
                    <div class="forecast-temp">${day.temp}°C</div>
                `;
                forecastContainer.appendChild(forecastItem);
            });
        }

        function setTimeBasedTheme() {
            const hour = new Date().getHours();
            const body = document.body;
            if (hour >= 6 && hour < 12) {
                body.style.background = 'linear-gradient(135deg, #ff9a9e 10%, #fad0c4 100%)';
            } else if (hour >= 12 && hour < 18) {
                body.style.background = 'linear-gradient(135deg, #f6d365 10%, #fda085 100%)';
            } else {
                body.style.background = 'linear-gradient(135deg, #f6d365 10%, #fda085 100%)';
            }
        }

        // Initialize the app
        updateForecast();
        setTimeBasedTheme();
        setInterval(setTimeBasedTheme, 60000); // Update theme every minute
    </script>
</body>
</html>
